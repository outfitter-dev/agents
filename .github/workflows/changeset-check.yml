name: Changeset Check

on:
  pull_request:
    branches: [main]
    paths:
      - "outfitter/**"
      - "but/**"
      - "gt/**"
      - "cli-dev/**"

jobs:
  check:
    name: Check for changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check for changeset
        run: |
          # Get list of changeset files (excluding config and README)
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)

          if [ "$CHANGESETS" -eq 0 ]; then
            echo "::error::No changeset found. Run 'bun changeset' to create one."
            echo ""
            echo "This PR modifies plugin files but doesn't include a changeset."
            echo "Please run 'bun changeset' and commit the generated file."
            exit 1
          fi

          echo "✓ Found $CHANGESETS changeset file(s)"
