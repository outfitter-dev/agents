name: Changeset Check

on:
  pull_request:
    branches: [main]
    paths:
      - "outfitter/**"
      - "but/**"
      - "gt/**"
      - "cli-dev/**"
      - "!**/package.json"

permissions:
  contents: read

jobs:
  check:
    name: Check for changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changeset
        run: |
          # Check if this PR adds a changeset file
          CHANGESETS_ADDED=$(git diff --name-only origin/main...HEAD | grep -E '^\.changeset/.*\.md$' | grep -v README.md | wc -l)

          if [ "$CHANGESETS_ADDED" -eq 0 ]; then
            echo "::error::No changeset found in this PR."
            echo ""
            echo "This PR modifies plugin files but doesn't include a changeset."
            echo "If this is a feature or fix, run 'bun changeset' to create one."
            echo "If this is a chore/test/ci/build commit, the changeset is optional."
            exit 1
          fi

          echo "✓ Found $CHANGESETS_ADDED changeset file(s) added in this PR"
